<style>
*{box-sizing:border-box}
:root{--bg:#fff;--fg:#000;--muted:#555;--line:#000;--soft:#f3f3f3;color-scheme:light light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--muted:#aaa;--line:#fff;--soft:#161616;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:24px 14px 60px}
header{border:2px solid var(--line);border-radius:16px;padding:26px 18px;margin-bottom:16px;text-align:center}
h1{margin:0;font-weight:800;font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:-.02em;line-height:1.15}
header p{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:.95rem;background:var(--bg);color:var(--fg)}
button{cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.85rem;background:var(--bg);color:var(--fg);font-family:inherit}
button:hover{background:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{padding:9px 16px;font-size:.9rem}
.tabs button.on{background:var(--fg);color:var(--bg);font-weight:600}
.count{margin:0 4px 10px;color:var(--muted);font-size:.85rem}
.card{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg);overflow:hidden}
.card>summary{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer;list-style:none;font-size:.95rem}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"\203A";margin-left:auto;font-size:1.3rem;line-height:1;transition:transform .2s}
.card[open]>summary::after{transform:rotate(90deg)}
.num{flex:0 0 auto;min-width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;font-size:.78rem;font-weight:700}
.card[open]>summary .num{background:var(--fg);color:var(--bg)}
.body{padding:0 16px 16px}
.question{margin:0 0 12px;font-size:.92rem}
.label{margin:6px 0 8px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
pre{margin:0;padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow-x:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;line-height:1.6;max-width:100%;tab-size:4;color:var(--fg)}
.copy{margin-top:12px;background:var(--fg);color:var(--bg);font-weight:600}
.copy:hover{background:var(--fg);opacity:.85}
.complexity{margin:12px 0 0;font-size:.82rem;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:22px}
</style></head><body>

<script>
const programs = [{"category": "Root Finding", "title": "Bisection Method", "question": "Write a C program to find a root of f(x) = x³ − x − 4 using the Bisection Method.", "code": "#include <stdio.h>\n#include <math.h>\ndouble f(double x){ return x*x*x-x-4; }\nint main(void){\n    double a,b,mid,eps;\n    int i=0;\n    printf(\"Enter a and b: \"); scanf(\"%lf%lf\",&a,&b);\n    printf(\"Enter tolerance: \"); scanf(\"%lf\",&eps);\n    if(f(a)*f(b)>0){ puts(\"Invalid interval: f(a) and f(b) must have opposite signs.\"); return 1; }\n    do{\n        mid=(a+b)/2.0; i++;\n        if(f(a)*f(mid)<0) b=mid; else a=mid;\n    }while(fabs(b-a)>eps && fabs(f(mid))>eps);\n    printf(\"Root = %.8f\\nIterations = %d\\n\",mid,i);\n    return 0;\n}", "complexity": "Best and worst time: O(log((b−a)/ε)) iterations for a fixed tolerance; one function evaluation per iteration."}, {"category": "Root Finding", "title": "False Position (Regula Falsi) Method", "question": "Write a C program to find a root using the False Position Method.", "code": "#include <stdio.h>\n#include <math.h>\ndouble f(double x){ return x*x*x-x-4; }\nint main(void){\n    double a,b,c,eps;\n    int i=0;\n    printf(\"Enter a and b: \"); scanf(\"%lf%lf\",&a,&b);\n    printf(\"Enter tolerance: \"); scanf(\"%lf\",&eps);\n    if(f(a)*f(b)>0){ puts(\"Invalid interval.\"); return 1; }\n    do{\n        c=(a*f(b)-b*f(a))/(f(b)-f(a)); i++;\n        if(f(a)*f(c)<0) b=c; else a=c;\n    }while(fabs(f(c))>eps && fabs(b-a)>eps && i<10000);\n    printf(\"Root = %.8f\\nIterations = %d\\n\",c,i);\n    return 0;\n}", "complexity": "Convergence depends on the function and starting interval; worst case can be slow (up to O(1/ε) iterations)."}, {"category": "Root Finding", "title": "Newton–Raphson Method", "question": "Write a C program to approximate a root using Newton–Raphson Method.", "code": "#include <stdio.h>\n#include <math.h>\ndouble f(double x){ return x*x*x-x-4; }\ndouble df(double x){ return 3*x*x-1; }\nint main(void){\n    double x,next,eps;\n    int i,n;\n    printf(\"Initial guess: \"); scanf(\"%lf\",&x);\n    printf(\"Tolerance and max iterations: \"); scanf(\"%lf%d\",&eps,&n);\n    for(i=1;i<=n;i++){\n        if(fabs(df(x))<1e-12){ puts(\"Derivative is too small.\"); return 1; }\n        next=x-f(x)/df(x);\n        if(fabs(next-x)<eps){ printf(\"Root = %.8f after %d iterations\\n\",next,i); return 0; }\n        x=next;\n    }\n    printf(\"Approximation after %d iterations = %.8f\\n\",n,x);\n    return 0;\n}", "complexity": "Best case: quadratic convergence near a simple root; worst case: may diverge or fail to converge."}, {"category": "Root Finding", "title": "Birge–Vieta Method", "question": "Write a C program to find a root of a polynomial using the Birge–Vieta Method. Enter coefficients from highest power to constant.", "code": "#include <stdio.h>\n#include <math.h>\n#define MAX 30\nint main(void){\n    int n,i,k,maxit; double a[MAX],b[MAX],c[MAX],p,eps;\n    printf(\"Degree of polynomial: \"); scanf(\"%d\",&n);\n    if(n<1 || n>=MAX) return 1;\n    printf(\"Enter %d coefficients (highest power first): \",n+1);\n    for(i=0;i<=n;i++) scanf(\"%lf\",&a[i]);\n    printf(\"Initial guess, tolerance, max iterations: \"); scanf(\"%lf%lf%d\",&p,&eps,&maxit);\n    for(k=1;k<=maxit;k++){\n        b[0]=a[0];\n        for(i=1;i<=n;i++) b[i]=a[i]+p*b[i-1];\n        c[0]=b[0];\n        for(i=1;i<n;i++) c[i]=b[i]+p*c[i-1];\n        if(fabs(c[n-1])<1e-14){ puts(\"Derivative too small.\"); return 1; }\n        { double next=p-b[n]/c[n-1];\n          if(fabs(next-p)<eps){ printf(\"Root = %.8f\\n\",next); return 0; }\n          p=next;\n        }\n    }\n    printf(\"No convergence. Last estimate = %.8f\\n\",p);\n    return 0;\n}", "complexity": "Similar to Newton–Raphson; quadratic convergence near a simple root, but convergence is not guaranteed."}, {"category": "Linear Systems", "title": "Gauss Elimination Method", "question": "Write a C program to solve simultaneous linear equations using Gauss Elimination.", "code": "#include <stdio.h>\n#include <math.h>\n#define N 20\nint main(void){\n    int n,i,j,k; double a[N][N+1],x[N];\n    printf(\"Number of equations: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    printf(\"Enter augmented matrix row-wise (%d values per row):\\n\",n+1);\n    for(i=0;i<n;i++) for(j=0;j<=n;j++) scanf(\"%lf\",&a[i][j]);\n    for(k=0;k<n;k++){\n        int p=k;\n        for(i=k+1;i<n;i++) if(fabs(a[i][k])>fabs(a[p][k])) p=i;\n        if(fabs(a[p][k])<1e-12){ puts(\"No unique solution.\"); return 1; }\n        for(j=k;j<=n;j++){ double t=a[k][j];a[k][j]=a[p][j];a[p][j]=t; }\n        for(i=k+1;i<n;i++){ double m=a[i][k]/a[k][k]; for(j=k;j<=n;j++) a[i][j]-=m*a[k][j]; }\n    }\n    for(i=n-1;i>=0;i--){ double s=a[i][n]; for(j=i+1;j<n;j++) s-=a[i][j]*x[j]; x[i]=s/a[i][i]; }\n    for(i=0;i<n;i++) printf(\"x%d = %.6f\\n\",i+1,x[i]);\n    return 0;\n}", "complexity": "O(n³) time; O(n²) storage."}, {"category": "Linear Systems", "title": "Gauss–Jordan Method", "question": "Write a C program to solve simultaneous linear equations using Gauss–Jordan elimination.", "code": "#include <stdio.h>\n#include <math.h>\n#define N 20\nint main(void){\n    int n,i,j,k; double a[N][N+1];\n    printf(\"Number of equations: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    printf(\"Enter augmented matrix row-wise:\\n\");\n    for(i=0;i<n;i++) for(j=0;j<=n;j++) scanf(\"%lf\",&a[i][j]);\n    for(k=0;k<n;k++){\n        int p=k;\n        for(i=k+1;i<n;i++) if(fabs(a[i][k])>fabs(a[p][k])) p=i;\n        if(fabs(a[p][k])<1e-12){ puts(\"No unique solution.\"); return 1; }\n        for(j=0;j<=n;j++){ double t=a[k][j];a[k][j]=a[p][j];a[p][j]=t; }\n        { double d=a[k][k]; for(j=0;j<=n;j++) a[k][j]/=d; }\n        for(i=0;i<n;i++) if(i!=k){ double m=a[i][k]; for(j=0;j<=n;j++) a[i][j]-=m*a[k][j]; }\n    }\n    for(i=0;i<n;i++) printf(\"x%d = %.6f\\n\",i+1,a[i][n]);\n    return 0;\n}", "complexity": "O(n³) time; O(n²) storage."}, {"category": "Linear Systems", "title": "Jacobi Iteration Method", "question": "Write a C program to solve a diagonally dominant system using Jacobi Iteration.", "code": "#include <stdio.h>\n#include <math.h>\n#define N 20\nint main(void){\n    int n,i,j,k,maxit; double a[N][N+1],x[N]={0},y[N],eps;\n    printf(\"n: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    printf(\"Enter augmented matrix row-wise:\\n\");\n    for(i=0;i<n;i++) for(j=0;j<=n;j++) scanf(\"%lf\",&a[i][j]);\n    printf(\"Tolerance and max iterations: \"); scanf(\"%lf%d\",&eps,&maxit);\n    for(i=0;i<n;i++) if(fabs(a[i][i])<1e-12){ puts(\"Zero diagonal entry.\"); return 1; }\n    for(k=0;k<maxit;k++){\n        double err=0;\n        for(i=0;i<n;i++){ double s=a[i][n]; for(j=0;j<n;j++) if(j!=i) s-=a[i][j]*x[j]; y[i]=s/a[i][i]; }\n        for(i=0;i<n;i++){ if(fabs(y[i]-x[i])>err) err=fabs(y[i]-x[i]); x[i]=y[i]; }\n        if(err<eps) break;\n    }\n    for(i=0;i<n;i++) printf(\"x%d = %.6f\\n\",i+1,x[i]);\n    printf(\"Iterations = %d\\n\",k+1); return 0;\n}", "complexity": "O(n²) per iteration; convergence is guaranteed under conditions such as strict diagonal dominance."}, {"category": "Linear Systems", "title": "Gauss–Seidel Method", "question": "Write a C program to solve a diagonally dominant system using Gauss–Seidel Iteration.", "code": "#include <stdio.h>\n#include <math.h>\n#define N 20\nint main(void){\n    int n,i,j,k,maxit; double a[N][N+1],x[N]={0},eps;\n    printf(\"n: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    printf(\"Enter augmented matrix row-wise:\\n\");\n    for(i=0;i<n;i++) for(j=0;j<=n;j++) scanf(\"%lf\",&a[i][j]);\n    printf(\"Tolerance and max iterations: \"); scanf(\"%lf%d\",&eps,&maxit);\n    for(i=0;i<n;i++) if(fabs(a[i][i])<1e-12){ puts(\"Zero diagonal entry.\"); return 1; }\n    for(k=0;k<maxit;k++){\n        double err=0;\n        for(i=0;i<n;i++){\n            double s=a[i][n];\n            for(j=0;j<n;j++) if(j!=i) s-=a[i][j]*x[j];\n            { double v=s/a[i][i]; if(fabs(v-x[i])>err) err=fabs(v-x[i]); x[i]=v; }\n        }\n        if(err<eps) break;\n    }\n    for(i=0;i<n;i++) printf(\"x%d = %.6f\\n\",i+1,x[i]);\n    printf(\"Iterations = %d\\n\",k+1); return 0;\n}", "complexity": "O(n²) per iteration; often converges faster than Jacobi, but convergence is not universal."}, {"category": "Finite Differences", "title": "Newton Forward Difference Table", "question": "Write a C program to generate a Newton Forward Difference Table for equally spaced x-values.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],d[N][N];\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&d[i][0]); }\n    for(j=1;j<n;j++) for(i=0;i<n-j;i++) d[i][j]=d[i+1][j-1]-d[i][j-1];\n    puts(\"\\nForward difference table:\");\n    for(i=0;i<n;i++){ printf(\"%10.4f\",x[i]); for(j=0;j<n-i;j++) printf(\"%12.4f\",d[i][j]); puts(\"\"); }\n    return 0;\n}", "complexity": "O(n²) time and O(n²) storage."}, {"category": "Finite Differences", "title": "Newton Backward Difference Table", "question": "Write a C program to generate a Newton Backward Difference Table.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],d[N][N];\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&d[i][0]); }\n    for(j=1;j<n;j++) for(i=j;i<n;i++) d[i][j]=d[i][j-1]-d[i-1][j-1];\n    puts(\"\\nBackward difference table:\");\n    for(i=0;i<n;i++){ printf(\"%10.4f\",x[i]); for(j=0;j<=i;j++) printf(\"%12.4f\",d[i][j]); puts(\"\"); }\n    return 0;\n}", "complexity": "O(n²) time and O(n²) storage."}, {"category": "Finite Differences", "title": "Newton Divided Difference Table", "question": "Write a C program to generate a Newton Divided Difference Table for unequal x-values.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],d[N][N];\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&d[i][0]); }\n    for(j=1;j<n;j++) for(i=0;i<n-j;i++){\n        double den=x[i+j]-x[i];\n        if(den==0){ puts(\"Repeated x values.\"); return 1; }\n        d[i][j]=(d[i+1][j-1]-d[i][j-1])/den;\n    }\n    puts(\"\\nDivided difference table:\");\n    for(i=0;i<n;i++){ printf(\"%10.4f\",x[i]); for(j=0;j<n-i;j++) printf(\"%12.6f\",d[i][j]); puts(\"\"); }\n    return 0;\n}", "complexity": "O(n²) time and O(n²) storage."}, {"category": "Interpolation", "title": "Newton Divided Difference Interpolation", "question": "Write a C program to estimate y at a given x using Newton Divided Difference Interpolation.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],d[N][N],v,sum,term;\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&d[i][0]); }\n    for(j=1;j<n;j++) for(i=0;i<n-j;i++){\n        double den=x[i+j]-x[i]; if(den==0) return 1;\n        d[i][j]=(d[i+1][j-1]-d[i][j-1])/den;\n    }\n    printf(\"Enter x to interpolate: \"); scanf(\"%lf\",&v);\n    sum=d[0][0]; term=1;\n    for(i=1;i<n;i++){ term*=v-x[i-1]; sum+=d[0][i]*term; }\n    printf(\"Interpolated y = %.8f\\n\",sum); return 0;\n}", "complexity": "O(n²) to build the table and O(n) to evaluate the polynomial."}, {"category": "Interpolation", "title": "Lagrange Interpolation", "question": "Write a C program to estimate y at a given x using Lagrange Interpolation.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],y[N],v,sum=0,term;\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&y[i]); }\n    printf(\"Enter x to interpolate: \"); scanf(\"%lf\",&v);\n    for(i=0;i<n;i++){\n        term=y[i];\n        for(j=0;j<n;j++) if(j!=i){\n            if(x[i]==x[j]){ puts(\"Repeated x values.\"); return 1; }\n            term *= (v-x[j])/(x[i]-x[j]);\n        }\n        sum+=term;\n    }\n    printf(\"Interpolated y = %.8f\\n\",sum); return 0;\n}", "complexity": "O(n²) time and O(n) storage."}, {"category": "Interpolation", "title": "Inverse Lagrange Interpolation", "question": "Write a C program to estimate x for a given y using inverse Lagrange interpolation.", "code": "#include <stdio.h>\n#define N 20\nint main(void){\n    int n,i,j; double x[N],y[N],v,sum=0,term;\n    printf(\"Number of data points: \"); scanf(\"%d\",&n);\n    if(n<1||n>N) return 1;\n    for(i=0;i<n;i++){ printf(\"x y: \"); scanf(\"%lf%lf\",&x[i],&y[i]); }\n    printf(\"Enter y to estimate x: \"); scanf(\"%lf\",&v);\n    for(i=0;i<n;i++){\n        term=x[i];\n        for(j=0;j<n;j++) if(j!=i){\n            if(y[i]==y[j]){ puts(\"Repeated y values.\"); return 1; }\n            term *= (v-y[j])/(y[i]-y[j]);\n        }\n        sum+=term;\n    }\n    printf(\"Estimated x = %.8f\\n\",sum); return 0;\n}", "complexity": "O(n²) time and O(n) storage; meaningful when y-values can be used as distinct interpolation nodes."}, {"category": "Numerical Integration", "title": "Trapezoidal Rule", "question": "Write a C program to evaluate an integral using the Composite Trapezoidal Rule. The sample function is 1/(1+x⁴).", "code": "#include <stdio.h>\ndouble f(double x){ return 1.0/(1.0+x*x*x*x); }\nint main(void){\n    int n,i; double a,b,h,sum=0;\n    printf(\"Enter lower limit, upper limit and subintervals: \");\n    scanf(\"%lf%lf%d\",&a,&b,&n);\n    if(n<=0||b<=a) return 1;\n    h=(b-a)/n; sum=f(a)+f(b);\n    for(i=1;i<n;i++) sum+=2*f(a+i*h);\n    printf(\"Integral = %.8f\\n\",h*sum/2); return 0;\n}", "complexity": "O(n) function evaluations; error is O(h²) for sufficiently smooth functions."}, {"category": "Numerical Integration", "title": "Simpson’s 1/3 Rule", "question": "Write a C program to evaluate an integral using Composite Simpson’s 1/3 Rule (n must be even).", "code": "#include <stdio.h>\ndouble f(double x){ return 1.0/(1.0+x*x*x*x); }\nint main(void){\n    int n,i; double a,b,h,sum;\n    printf(\"Enter lower limit, upper limit and an even number of subintervals: \");\n    scanf(\"%lf%lf%d\",&a,&b,&n);\n    if(n<=0||n%2!=0||b<=a){ puts(\"Use b > a and a positive even n.\"); return 1; }\n    h=(b-a)/n; sum=f(a)+f(b);\n    for(i=1;i<n;i++) sum+=(i%2?4:2)*f(a+i*h);\n    printf(\"Integral = %.8f\\n\",sum*h/3); return 0;\n}", "complexity": "O(n) function evaluations; error is O(h⁴) for sufficiently smooth functions."}, {"category": "Numerical Integration", "title": "Simpson’s 3/8 Rule", "question": "Write a C program to evaluate an integral using Composite Simpson’s 3/8 Rule (n must be a multiple of 3).", "code": "#include <stdio.h>\ndouble f(double x){ return 1.0/(1.0+x*x*x*x); }\nint main(void){\n    int n,i; double a,b,h,sum;\n    printf(\"Enter lower limit, upper limit and subintervals (multiple of 3): \");\n    scanf(\"%lf%lf%d\",&a,&b,&n);\n    if(n<=0||n%3!=0||b<=a){ puts(\"Use b > a and n divisible by 3.\"); return 1; }\n    h=(b-a)/n; sum=f(a)+f(b);\n    for(i=1;i<n;i++) sum+=(i%3==0?2:3)*f(a+i*h);\n    printf(\"Integral = %.8f\\n\",3*h*sum/8); return 0;\n}", "complexity": "O(n) function evaluations; error is O(h⁴) for sufficiently smooth functions."}, {"category": "Differential Equations", "title": "Euler’s Method", "question": "Write a C program to solve dy/dx = x*y with an initial value using Euler’s Method.", "code": "#include <stdio.h>\ndouble f(double x,double y){ return x*y; }\nint main(void){\n    int n,i; double x,y,xend,h;\n    printf(\"Enter x0 y0 x_end and number of steps: \"); scanf(\"%lf%lf%lf%d\",&x,&y,&xend,&n);\n    if(n<=0) return 1;\n    h=(xend-x)/n;\n    printf(\"x\\ty\\n\");\n    for(i=0;i<n;i++){ printf(\"%.5f\\t%.8f\\n\",x,y); y=y+h*f(x,y); x+=h; }\n    printf(\"Approximate y(%.5f) = %.8f\\n\",x,y); return 0;\n}", "complexity": "O(n) steps; global error is typically O(h)."}, {"category": "Differential Equations", "title": "Modified Euler’s Method", "question": "Write a C program to solve dy/dx = x² + y using the Modified Euler (predictor-corrector) Method.", "code": "#include <stdio.h>\n#include <math.h>\ndouble f(double x,double y){ return x*x+y; }\nint main(void){\n    int n,i,it; double x,y,xend,h,p,c,eps=1e-10;\n    printf(\"Enter x0 y0 x_end and steps: \"); scanf(\"%lf%lf%lf%d\",&x,&y,&xend,&n);\n    if(n<=0) return 1;\n    h=(xend-x)/n;\n    for(i=0;i<n;i++){\n        p=y+h*f(x,y); c=y+h*(f(x,y)+f(x+h,p))/2;\n        for(it=0;it<20 && fabs(c-p)>eps;it++){ p=c; c=y+h*(f(x,y)+f(x+h,p))/2; }\n        y=c; x+=h;\n    }\n    printf(\"Approximate y(%.5f) = %.8f\\n\",x,y); return 0;\n}", "complexity": "O(n) steps for a fixed number of corrections; global error is typically O(h²)."}, {"category": "Differential Equations", "title": "Runge–Kutta Second Order Method", "question": "Write a C program to solve dy/dx = x*y using the second-order Runge–Kutta Method.", "code": "#include <stdio.h>\ndouble f(double x,double y){ return x*y; }\nint main(void){\n    int n,i; double x,y,xend,h,k1,k2;\n    printf(\"Enter x0 y0 x_end and steps: \"); scanf(\"%lf%lf%lf%d\",&x,&y,&xend,&n);\n    if(n<=0) return 1;\n    h=(xend-x)/n;\n    for(i=0;i<n;i++){\n        k1=h*f(x,y); k2=h*f(x+h,y+k1);\n        y+=(k1+k2)/2; x+=h;\n    }\n    printf(\"Approximate y(%.5f) = %.8f\\n\",x,y); return 0;\n}", "complexity": "O(n) steps; the second-order method has global error typically O(h²)."}];
const categories=[...new Set(programs.map(p=>p.category))];
let cat='';
const tabs=document.getElementById('tabs');
['',...categories].forEach(c=>{const b=document.createElement('button');b.textContent=c||'All';b.dataset.c=c;b.onclick=()=>{cat=c;render()};tabs.appendChild(b)});
function render(){
 const term=document.getElementById('search').value.toLowerCase();
 tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
 const filtered=programs.filter(p=>(!cat||p.category===cat)&&[p.category,p.title,p.question,p.code].join(' ').toLowerCase().includes(term));
 const root=document.getElementById('content');root.innerHTML='';
 document.getElementById('count').textContent=filtered.length+' program(s)';
 filtered.forEach((p,i)=>{
  const d=document.createElement('details');d.className='card';
  const s=document.createElement('summary');
  const n=document.createElement('span');n.className='num';n.textContent=i+1;
  const t=document.createElement('span');t.textContent=p.title;
  s.append(n,t);d.appendChild(s);
  const body=document.createElement('div');body.className='body';
  const q=document.createElement('p');q.className='question';q.textContent=p.question;body.appendChild(q);
  const l=document.createElement('div');l.className='label';l.textContent='Code \u00b7 C \u00b7 '+p.category;body.appendChild(l);
  const pre=document.createElement('pre');pre.textContent=p.code;body.appendChild(pre);
  const b=document.createElement('button');b.className='copy';b.textContent='Copy C Program';
  b.addEventListener('click',()=>{try{navigator.clipboard.writeText(p.code).then(()=>b.textContent='Copied!').catch(()=>b.textContent='Select and copy the code')}catch(e){b.textContent='Select and copy the code'}});
  body.appendChild(b);
  const comp=document.createElement('p');comp.className='complexity';comp.textContent='Complexity: '+p.complexity;body.appendChild(comp);
  d.appendChild(body);root.appendChild(d);
 });
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);
document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
render();
</script></body></html>
